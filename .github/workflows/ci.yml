# Manual CI only — Netlify builds and deploys on every push (see netlify.toml).
# This workflow used to run on every push too; strict gates (npm audit, sitemap drift,
# duplicate-blog scan) failed often and sent failure emails even while production was fine.
#
# Run manually: GitHub → Actions → CI → Run workflow
# Local equivalent: npm run ci
#
# Optional Netlify redeploy from here requires secrets:
#   NETLIFY_AUTH_TOKEN — https://app.netlify.com/user/applications#personal-access-tokens
#   NETLIFY_SITE_ID     — 8f9a63bc-94a5-4fd9-a304-5246ee9a0b5c
name: CI

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to Netlify production after validation
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=critical

      - name: Build assets
        run: npm run build:minify

      - name: Verify sitemap URL list
        env:
          TZ: Australia/Melbourne
        run: node scripts/verify-sitemap-locs.mjs

      - name: Verify blog ItemList JSON-LD
        run: node scripts/verify-blog-itemlist.mjs

      - name: Blog duplicate body scan
        run: node scripts/blog-duplicate-scan.mjs

      - name: Prepare Netlify publish directory
        run: node scripts/prepare-netlify-publish.mjs

      - name: Check Netlify deploy credentials
        id: netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          want_deploy=false
          if [ "${{ inputs.deploy }}" = "true" ] && [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ]; then
            want_deploy=true
          elif [ "${{ inputs.deploy }}" = "true" ]; then
            echo "::notice title=Netlify deploy skipped::Add NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID in GitHub → Settings → Secrets → Actions."
          fi
          echo "deploy=$want_deploy" >> "$GITHUB_OUTPUT"

      - name: Deploy to Netlify (production)
        if: steps.netlify.outputs.deploy == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx --yes netlify-cli@17 deploy \
            --dir=.netlify-publish \
            --prod \
            --message "GitHub Actions: ${{ github.sha }}"

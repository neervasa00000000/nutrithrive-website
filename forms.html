<!DOCTYPE html>
<html lang="en-AU">
<head>
<!-- Favicons (PNG/ICO for Google Search/Images; WebP is not reliable for favicons) -->
<link rel="icon" type="image/png" sizes="48x48" href="/assets/images/logo/favicon-48.png">
<link rel="icon" href="/assets/images/logo/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="96x96" href="/assets/images/logo/favicon-96.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/images/logo/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="msapplication-TileImage" content="/assets/images/logo/apple-touch-icon.png">
<meta name="msapplication-TileColor" content="#0f6b4d">


  <meta charset="utf-8">
  <title>Forms</title>
  <meta name="robots" content="noindex, nofollow">
</head>
<body>
  <!-- Netlify form detection (hidden). Submissions also appear in Netlify → Forms when JS fallback runs. -->
  <form name="contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="contact">
    <input name="bot-field">
    <input name="name">
    <input name="email">
    <input name="subject">
    <textarea name="message"></textarea>
  </form>
  <form name="newsletter" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="newsletter">
    <input name="bot-field">
    <input name="name">
    <input name="email">
  </form>
</body>
</html>
